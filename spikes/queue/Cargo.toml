[package]
name = "queue-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
graphile_worker = "=0.14.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
