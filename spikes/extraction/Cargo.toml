[package]
name = "extraction-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
kamadak-exif = "=0.6.1"
lopdf = { version = "=0.46.0", default-features = false }
ocrs = { version = "=0.13.1", default-features = false, features = ["onnx"] }
pdfium-render = "=0.9.5"
quick-xml = "=0.42.0"
rten = "=0.26.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zip = { version = "=9.2.2", default-features = false, features = ["deflate"] }
