[package]
name = "whorl"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
rayon = "=1.12.0"
serde_json = "1.0.154"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "tls-rustls-ring-native-roots"] }
thiserror = "=2.0.21"
tokio = { version = "1", features = ["sync"] }
unicode-normalization = "=0.1.26"
uuid = "1"
xxhash-rust = { version = "=0.8.19", features = ["xxh3"] }

[[bench]]
name = "signatures"
harness = false

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
