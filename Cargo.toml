[package]
name = "whorl"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
graphile_worker = "=0.14.1"
calamine = "=0.38.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
nom-exif = "=3.8.0"
ocrs = { version = "=0.13.1", default-features = false, features = ["onnx"] }
pdfium-render = "=0.9.5"
quick-xml = "=0.42.0"
rten = "=0.26.0"
serde = { version = "=1.0.229", features = ["derive"] }
libc = "0.2"
tempfile = "3"
zip = { version = "=9.2.2", default-features = false, features = ["deflate"] }
bytes = "1"
object_store = { version = "=0.14.2", default-features = false, features = ["aws"] }
rayon = "=1.12.0"
serde_json = "1.0.154"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "tls-rustls-ring-native-roots"] }
thiserror = "=2.0.21"
tokio = { version = "1", features = ["io-util", "sync", "process", "time", "fs", "macros", "rt-multi-thread"] }
unicode-normalization = "=0.1.26"
uuid = { version = "1", features = ["v4", "serde"] }
xxhash-rust = { version = "=0.8.19", features = ["xxh3"] }
actix-web = { version = "=4.18.1", default-features = false, features = ["macros"] }
actix-multipart = { version = "=0.8.5", default-features = false }
futures-util = "0.3.34"
tokio-util = { version = "0.7.20", features = ["io"] }
mime = "0.3.17"

[[bench]]
name = "signatures"
harness = false

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
