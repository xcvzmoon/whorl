name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Require an opening description
        if: ${{ github.event_name == 'pull_request' }}
        shell: python
        run: |
          import json
          import os
          import re

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as event_file:
              event = json.load(event_file)
          body = re.sub(r'<!--.*?-->', '', event['pull_request'].get('body') or '', flags=re.S).strip()
          opening = re.split(r'\n\s*\n', body, maxsplit=1)[0]
          sentences = re.split(r'(?<=[.!?])\s+', opening)
          if (
              not opening
              or re.search(r'^\s*(?:#|[-*+>] |\d+[.)] |\||```|~~~)', opening, flags=re.M)
              or len(sentences) not in (2, 3)
              or any(not re.search(r'[.!?][\"\'\u2019\u201d)]*$', sentence) for sentence in sentences)
          ):
              raise SystemExit('Start the PR description with a paragraph of 2-3 complete sentences before any headings or lists.')

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Run static gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Prepare extraction corpus
        run: |
          python3 spikes/extraction/corpus.py generate
          python3 spikes/extraction/corpus.py verify

      - name: Run tests
        run: |
          cargo test --locked --all-targets --all-features
          cargo test --locked --doc --all-features

      - name: Verify PostgreSQL schema and reservation races
        env:
          WHORL_SCHEMA_TEST_URL: postgresql://postgres@localhost:5432/postgres
        run: cargo test --locked --test schema -- --ignored

      - name: Verify PostgreSQL candidate matching
        env:
          WHORL_CANDIDATES_TEST_URL: postgresql://postgres@localhost:5432/whorl_candidates_test
        run: |
          psql -X -w postgresql://postgres@localhost:5432/postgres -c 'CREATE DATABASE whorl_candidates_test'
          cargo test --locked --test candidates -- --ignored

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

      - name: Audit dependencies and licenses
        run: cargo deny check advisories licenses sources

      - name: Build server
        run: cargo build --locked --release

  ci:
    name: CI
    if: ${{ always() }}
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$CHECKS_RESULT" = success
