name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  minio:
    name: Build integration storage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Build pinned MinIO
        run: |
          GOBIN="$RUNNER_TEMP/minio-bin" go install github.com/minio/minio@9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
          "$RUNNER_TEMP/minio-bin/minio" --version

      - name: Upload integration storage binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: minio-linux-amd64
          path: ${{ runner.temp }}/minio-bin/minio
          retention-days: 1

  checks:
    name: Checks
    needs: [minio]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PGPASSWORD: whorl-ci
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    services:
      postgres:
        image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_PASSWORD: whorl-ci
          POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Require an opening description
        if: ${{ github.event_name == 'pull_request' }}
        shell: python
        run: |
          import json
          import os
          import re

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as event_file:
              event = json.load(event_file)
          body = re.sub(r'<!--.*?-->', '', event['pull_request'].get('body') or '', flags=re.S).strip()
          opening = re.split(r'\n\s*\n', body, maxsplit=1)[0]
          sentences = re.split(r'(?<=[.!?])\s+', opening)
          if (
              not opening
              or re.search(r'^\s*(?:#|[-*+>] |\d+[.)] |\||```|~~~)', opening, flags=re.M)
              or len(sentences) not in (2, 3)
              or any(not re.search(r'[.!?][\"\'\u2019\u201d)]*$', sentence) for sentence in sentences)
          ):
              raise SystemExit('Start the PR description with a paragraph of 2-3 complete sentences before any headings or lists.')

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Run static gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Prepare extraction corpus
        run: |
          python3 spikes/extraction/corpus.py generate
          python3 spikes/extraction/corpus.py verify

      - name: Run tests
        run: |
          cargo test --locked --all-targets --all-features
          cargo test --locked --doc --all-features

      - name: Download integration storage binary
        uses: actions/download-artifact@v8.0.2
        with:
          name: minio-linux-amd64
          path: ${{ runner.temp }}/minio-bin

      - name: Start MinIO for integration tests
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        run: |
          chmod +x "$RUNNER_TEMP/minio-bin/minio"
          "$RUNNER_TEMP/minio-bin/minio" server --address 127.0.0.1:9000 "$RUNNER_TEMP/minio-data" > "$RUNNER_TEMP/minio.log" 2>&1 &
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:9000/minio/health/ready
          curl --fail --aws-sigv4 'aws:amz:us-east-1:s3' --user minioadmin:minioadmin -X PUT http://127.0.0.1:9000/uploads

      - name: Verify PostgreSQL, S3, worker, and HTTP acceptance
        env:
          WHORL_ACCEPTANCE_ADMIN_URL: postgresql://postgres:whorl-ci@localhost:5432/postgres
          WHORL_STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
        run: bash scripts/acceptance.sh

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

      - name: Audit dependencies and licenses
        run: cargo deny check advisories licenses sources

      - name: Build server
        run: cargo build --locked --release

  ci:
    name: CI
    if: ${{ always() }}
    needs: [minio, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          STORAGE_RESULT: ${{ needs.minio.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$STORAGE_RESULT" = success
