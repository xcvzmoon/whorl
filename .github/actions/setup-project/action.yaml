name: Setup project
description: Install stable Rust with formatting, lint, and dependency audit tools. Requires checkout first.

runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install dependency auditor
      shell: bash
      run: cargo install cargo-deny --locked

    - name: Fetch locked dependencies
      shell: bash
      run: cargo fetch --locked
